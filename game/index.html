<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valley Mail — a bush-pilot mail run</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #102330; color: #fff5df; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    #loading[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- The game draws every screen into this canvas and hides/removes #loading when ready. -->
  <canvas id="game" width="1280" height="720" aria-label="Valley Mail flight game">
    Valley Mail requires a browser with Canvas support.
  </canvas>
  <div id="loading" role="status">Loading Valley Mail…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
